# Serves the app over HTTPS with XAMPP's Apache, separate from XAMPP's own httpd.conf
# (so XAMPP's dashboard and phpMyAdmin are not exposed). serve.ps1 starts it with:
#   NAWAD_APP_ROOT  app folder, forward slashes (e.g. C:/Program Files/Nawad System/capstone)
#   NAWAD_HOST      name or IP the certificate was made for (used as ServerName)
#
#   https://<host>/        the app
#   http://<host>/         plain address, redirects to HTTPS
#   http://<host>:8000/    old address, redirects to HTTPS

ServerRoot "C:/xampp/apache"
ServerName ${NAWAD_HOST}

Listen 443
Listen 80
Listen 8000

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule filter_module modules/mod_filter.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

# Same order as XAMPP's httpd-xampp.conf: PHP crashes Apache unless its DLLs load first.
LoadFile "C:/xampp/php/php8ts.dll"
LoadFile "C:/xampp/php/libpq.dll"
LoadFile "C:/xampp/php/libsqlite3.dll"
LoadModule php_module "C:/xampp/php/php8apache2_4.dll"
PHPIniDir "C:/xampp/php"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

TypesConfig conf/mime.types
AddType application/javascript .js .mjs

PidFile "logs/nawad-httpd.pid"
ErrorLog "logs/nawad-error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/nawad-access.log" common

# Enough worker threads for a whole office polling the realtime endpoint
ThreadsPerChild 150
MaxConnectionsPerChild 0
KeepAlive On
KeepAliveTimeout 5
Timeout 120

<Directory />
    AllowOverride None
    Require all denied
</Directory>

AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml

SSLSessionCache "shmcb:logs/nawad_ssl_scache(512000)"
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder off

<VirtualHost *:80 *:8000>
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^ https://%1%{REQUEST_URI} [R=302,L]
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot "${NAWAD_APP_ROOT}/public"

    SSLEngine on
    SSLCertificateFile "${NAWAD_APP_ROOT}/conf/https/server.crt"
    SSLCertificateKeyFile "${NAWAD_APP_ROOT}/conf/https/server.key"

    <Directory "${NAWAD_APP_ROOT}/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php

        # Scripts and stylesheets requested with a ?v= version tag never change for that tag.
        <FilesMatch "\.(js|css)$">
            <If "%{QUERY_STRING} =~ /(^|&)v=/">
                Header set Cache-Control "public, max-age=31536000, immutable"
            </If>
        </FilesMatch>
    </Directory>
</VirtualHost>
